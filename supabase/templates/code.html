<!doctype html>
<html>
  <body style="margin:0;padding:32px 16px;background:#0f1012;font-family:-apple-system,'Segoe UI',Roboto,sans-serif;color:#eeeef0">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
      <tr>
        <td align="center">
          <table role="presentation" width="420" cellpadding="0" cellspacing="0" style="max-width:420px;background:#1b1c1f;border-radius:24px;padding:28px">
            <tr><td style="font-size:20px;font-weight:700;letter-spacing:-0.02em">Your sign-in code</td></tr>
            <tr><td style="padding:8px 0 20px;font-size:14px;line-height:1.5;color:#8b8c93">Type it into Logout to sign in. It works once, for 15 minutes.</td></tr>
            <tr>
              <td style="padding:16px;border-radius:16px;background:#dcf82a;color:#161a02;font-family:'SFMono-Regular',Menlo,Consolas,monospace;font-size:30px;font-weight:700;letter-spacing:0.3em;text-align:center">{{ .Token }}</td>
            </tr>
            <tr><td style="padding-top:20px;font-size:12px;line-height:1.5;color:#8b8c93">If you didn't ask for it, you can ignore this email.</td></tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
